name: Vale

on:
  pull_request:
    paths:
      - 'src/source/content/**/*.md'
      - 'src/source/releasenotes/*.md'
      - 'src/source/partials/**/*.md'
      - '.vale.ini'
      - '.vale/**'

jobs:
  vale:
    name: Prose review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      # filter_mode: added limits comments to lines this PR adds or changes. The existing
      # content predates the sentence-case heading rule, so linting whole files would bury reviewers.
      # Advisory for now: fail_on_error stays false until the rules are tuned.
      # Fork PRs get a read-only token and can't post review comments; results are still in the job log.
      - uses: vale-cli/vale-action@v3
        with:
          files: all
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: false
          token: ${{ secrets.GITHUB_TOKEN }}
