name: E2E Tests for a Pull Request deployment

# http_status_checker_on_sta, backstop_vrt, and playwright need the PR's
# Pantheon multidev to actually be deployed, which is gated by the
# "PR Deployment Gate" workflow (pull_request_target, so it can use
# PANTHEON_MACHINE_TOKEN even for Dependabot PRs -- see that workflow file
# for why). A single workflow file can only have one trigger context, so
# those three jobs run on workflow_run instead of pull_request and are
# guarded by `if: github.event_name == 'workflow_run' && ...conclusion ==
# 'success'`. vitest doesn't depend on the deployment, so it stays on
# pull_request for fast, independent feedback.
#
# workflow_run runs the workflow file from the base branch, but does NOT
# default to checking out the PR's head content -- these jobs explicitly
# set `ref: ${{ github.event.workflow_run.head_sha }}` because, unlike the
# deployment gate, they genuinely need to test the PR's own code. None of
# these three jobs reference secrets; keep it that way if they're ever
# touched, since they run PR-authored code (npm ci, playwright specs).
on:
  pull_request:
    types: [opened, synchronize]
  workflow_run:
    workflows: ["PR Deployment Gate"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false
jobs:
  http_status_checker_on_sta:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check all status codes
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SITE_NAME: "${{ vars.PANTHEON_SITE_MACHINE_NAME }}"
        run: |
          cd tests/404checking
          export URL="https://pr-${PR_NUMBER}-${SITE_NAME}.pantheonsite.io"
          ./404finder.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sta404report
          path: tests/404checking/

  backstop_vrt:
    runs-on: macos-latest
    needs: http_status_checker_on_sta
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install backstop
        shell: bash
        run: npm install -g backstopjs

      - name: Run Backstop tests
        id: backstop_tests
        shell: bash
        env:
          REFERENCE_BASE_URL: "https://dev-${{ vars.PANTHEON_SITE_MACHINE_NAME }}.pantheonsite.io"
          DEPLOYED_BASE_URL: "https://pr-${{ github.event.workflow_run.pull_requests[0].number }}-${{ vars.PANTHEON_SITE_MACHINE_NAME }}.pantheonsite.io"
        run: |
          #!/bin/bash
          set +e
          cd tests/backstop
          backstop reference --config="backstop.js"
          backstop test --config="backstop.js"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backstop_vrt
          path: tests/backstop

  playwright:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        shell: bash
        run: cd tests/playwright && npm ci

      - name: Install Playwright Browsers
        shell: bash
        run: cd tests/playwright && npx playwright install chromium --only-shell

      - name: Run Playwright tests
        id: playwright_tests
        shell: bash
        env:
          PLAYWRIGHT_DOMAIN: "pr-${{ github.event.workflow_run.pull_requests[0].number }}-${{ vars.PANTHEON_SITE_MACHINE_NAME }}.pantheonsite.io"
        run: |
          #!/bin/bash
          set +e
          cd tests/playwright
          npx playwright test --fail-on-flaky-tests

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright_report
          path: tests/playwright/playwright-report

  vitest:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
      - run: npm ci
      - run: npm run test
