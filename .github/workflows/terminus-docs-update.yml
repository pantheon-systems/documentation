name: Update Terminus Docs Data

# Refreshes the machine-generated Terminus data files and opens a PR when they
# change. Replaces the nightly `update-tool terminus:update-docs` job that ran in
# pantheon-systems/updatinator, which broke when the Next.js migration moved
# these files from source/ to src/source/.
#
# Only the generated data files are automated. Release notes and the version /
# EOL table in 10-supported-terminus.md stay hand-written.

on:
  schedule:
    # Same slot the updatinator cron used.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      terminus_release:
        description: "Terminus release tag to pin (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terminus-docs-update
  cancel-in-progress: false

jobs:
  update:
    name: Refresh Terminus data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      # Only needed to execute the released terminus.phar.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Refresh Terminus data files
        env:
          # Raises the API rate limit; only public data is read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMINUS_RELEASE: ${{ inputs.terminus_release }}
        run: |
          if [ -n "${TERMINUS_RELEASE}" ]; then
            npx tsx scripts/terminus-docs.ts "--terminus-release=${TERMINUS_RELEASE}"
          else
            npx tsx scripts/terminus-docs.ts
          fi

      - name: Resolve Terminus version
        id: terminus
        run: |
          set -euo pipefail
          version="$(node -p "require('./src/source/data/commands.json').application.version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Deterministic per release, so a re-run updates the open PR instead of
          # opening another one.
          branch: terminus-docs/${{ steps.terminus.outputs.version }}
          base: main
          title: "Terminus ${{ steps.terminus.outputs.version }}: update commands and releases data"
          body: |
            Regenerated the machine-generated Terminus data files for **${{ steps.terminus.outputs.version }}**.

            - `src/source/data/commands.json` — from `terminus.phar list --format=json`
            - `src/source/data/terminusReleases.json` — from the GitHub Releases API

            Release notes and the version/EOL table in `10-supported-terminus.md` are
            not automated and still need to be written by hand.

            Generated by [`scripts/terminus-docs.ts`](https://github.com/pantheon-systems/documentation/blob/main/scripts/terminus-docs.ts)
            via [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          commit-message: "Update Terminus commands and releases data for ${{ steps.terminus.outputs.version }}"
          labels: "Topic: Automation"
          add-paths: |
            src/source/data/commands.json
            src/source/data/terminusReleases.json

      - name: Summary
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          VERSION: ${{ steps.terminus.outputs.version }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            echo "Terminus ${VERSION}: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Terminus ${VERSION}: data files already current, no PR needed." >> "$GITHUB_STEP_SUMMARY"
          fi
