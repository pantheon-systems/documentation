extends: capitalization
message: "Use sentence case for headings: '%s'."
level: warning
scope: heading
match: $sentence
# A colon starts a new "sentence" so the word after it may be capitalized.
indicators:
  - ':'
# Proper nouns, product names, and acronyms that keep their capitalization mid-heading.
# Vocab accept.txt covers spelling; this list covers capitalization checks.
# Names verified against each owner's own site; see the PR that added them. Multi-word entries
# match as a phrase, so 'WordPress Multisite' (the feature name) is exempt but a bare 'Multisite'
# in generic use is not.
exceptions:
  - Composer
  - CDN
  - CLI
  - CMS
  - CSS
  - Dashboard
  - Decoupled
  - Dev
  - Drupal
  - Drush
  - Fastly
  - Git
