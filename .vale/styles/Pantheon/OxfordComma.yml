extends: existence
message: "Add a comma before the last 'and' or 'or' in a list of three or more items."
link: https://developers.google.com/style/commas
level: warning
scope: sentence
nonword: true
# Replaces Google.OxfordComma, which matched any ", X and Y" and so flagged two-item pairs
# ("such as S3 or Cloud Storage"), compound predicates ("add a message and commit"), and
# participial phrases ("saving you time and effort"). Measured on main: about 20% of its
# alerts were real lists.
#
# This rule matches only the list shape "A, B and C" with no comma before the conjunction,
# where A, B, and the first word of C are each short and free of the words that mark a
# clause instead of a list item: articles, pronouns, auxiliaries, prepositions, and
# sentence adverbs. It is advisory and deliberately favors precision over recall; a
# list it misses is cheaper than a false alert a reviewer must dismiss.
