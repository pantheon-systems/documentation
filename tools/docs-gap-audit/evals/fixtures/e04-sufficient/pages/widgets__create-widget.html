<!doctype html><html><head><title>Create a widget</title></head><body><nav><a href="/widgets">Widgets</a></nav><main><h1>Create a widget</h1>
<h2>Prerequisites</h2><p>An account with the editor role.</p>
<h2>Steps</h2><ol><li>Open the dashboard.</li><li>Choose Create a widget.</li><li>Enter a name and select Save.</li></ol>
<h2>Verify</h2><p>The widget appears in the list. You can also call <code>widget_create</code> from the API.</p>
<p><a href="/widgets">Back to widgets</a></p></main></body></html>
