# Vale prose linter config. Runs in CI via .github/workflows/vale.yml and locally with `vale <file>`.
# Run `vale sync` once to download the Google package into .vale/styles (gitignored).
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Pantheon
Packages = Google

# The docs are .md files containing MDX components.
[formats]
mdx = md

[*.md]
BasedOnStyles = Pantheon, Google

# Pantheon.Headings replaces Google.Headings so we control the exceptions list.
Google.Headings = NO

# Too noisy for this corpus or covered by Pantheon rules. Revisit after tuning.
Google.Acronyms = NO
Google.Contractions = NO
Google.Colons = NO
Google.Parens = NO
Google.Quotes = NO
Google.Semicolons = NO
Google.WordList = NO
Google.WordListCase = NO
Google.EmDash = NO

# MDX component tags (<Alert ...>, </Alert>, <Partial ... />). The prose between them is still linted.
TokenIgnores = (</?[A-Z][A-Za-z]*(?:\s[^>]*)?/?>)
# Fenced code and the `{promptUser: user}` style info strings are skipped by Vale's Markdown parser already.

# Release notes use their own frontmatter schema but follow the same heading rule.
