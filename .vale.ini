# Vale prose linter config. Runs in CI via .github/workflows/vale.yml and locally with `vale <file>`.
# Run `vale sync` once to download the Google package into .vale/styles (gitignored).
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Pantheon
# Pinned to a release so every run lints with the same rules. Bump deliberately, in its own PR.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

# The docs are .md files containing MDX components.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Pantheon, Google

# Pantheon.Headings replaces Google.Headings so we control the exceptions list.
Google.Headings = NO

# Too noisy for this corpus or covered by Pantheon rules. Revisit after tuning.
Google.Acronyms = NO
Google.Contractions = NO
Google.Colons = NO
Google.Parens = NO
Google.Quotes = NO
Google.Semicolons = NO
Google.WordList = NO
Google.WordListCase = NO
Google.EmDash = NO

# Off for the four-week report-only period (approved 2026-10-06). Together these were
# 4,592 of 8,806 content alerts on main @ e966487 with no reader outcome behind them.
Google.Will = NO
Google.We = NO
Google.FirstPerson = NO
Google.Spacing = NO
Google.Units = NO
Google.Ordinal = NO
Google.DateFormat = NO
Google.AMPM = NO
Google.OptionalPlurals = NO
Google.Ellipses = NO

# Kept, but at warning instead of the package's error level (approved 2026-10-06).
# Still at error: Pantheon.Inclusive, Pantheon.TermsStrict, and Google.Gender and
# Google.Periods at their package level (0 hits on main @ e966487). Their level is an
# open decision before fail_on_error is turned on.
Google.Latin = warning
Google.Exclamation = warning
Google.LyHyphens = warning
Google.GenderBias = warning
Google.Slang = warning

# MDX component tags (<Alert ...>, </Alert>, <Partial ... />). The prose between them is still linted.
TokenIgnores = (</?[A-Z][A-Za-z]*(?:\s[^>]*)?/?>)
# Fenced code and the `{promptUser: user}` style info strings are skipped by Vale's Markdown parser already.

# Path sections use a leading **/ so they match whether Vale gets a repo-relative path
# (CI, run from the repo root) or an absolute one (editors, other working directories).
# Release notes deliberately have no section: they get every rule above, including
# Pantheon.Terms and Pantheon.TermsStrict.

# vale-exception: Pantheon.Inclusive, Google.GenderBias; this page quotes the terms it teaches readers to avoid; expires: never
[**/inclusive-language.md]
Pantheon.Inclusive = NO
Google.GenderBias = NO
